name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel in-progress runs for the same PR/branch when a new commit is pushed
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    name: typecheck / lint / grep / test / build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # No fetch-depth needed for non-history operations; default 1 is fastest.
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies (clean install from lockfile)
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint (ESLint flat config -- enforces no-Vercel-only-imports rule)
        run: npm run lint:check

      - name: Defense-in-depth grep -- no-Vercel-only-imports
        run: npm run check:no-vercel-imports

      - name: Defense-in-depth grep -- no-drizzle-push invocations
        run: npm run check:no-drizzle-push

      - name: Defense-in-depth -- db-smoke path filter matches real migrations (INFRA-06)
        run: npm run check:db-smoke-filter

      - name: Defense-in-depth -- seed SQL in sync with seedParams (D-D1)
        run: npm run check:seed-sql

      - name: Defense-in-depth grep -- no v10 localStorage keys (CUT-03)
        run: npm run check:no-v10-localstorage

      - name: Vitest unit tests
        run: npm test

      - name: Production build
        # Run with placeholder env vars so build-time imports don't fail.
        # The build itself doesn't actually connect to DB or blob.
        env:
          STORAGE_DRIVER: vercel
          BLOB_READ_WRITE_TOKEN: placeholder-not-used-in-build
          DATABASE_URL: postgres://placeholder@localhost:5432/placeholder
        run: npm run build

      - name: Verify standalone artifact present (BOOT-07 sanity)
        run: test -f .next/standalone/server.js

  # INFRA-02: CI migration smoke gate (D-05/D-06/D-07/D-08 + RESEARCH §5 Pattern B).
  # Pattern B: job always runs so the required-status-check is always satisfiable.
  # Internal steps are gated on the paths-filter output — exits in ~5s when no schema diff.
  db-smoke:
    name: db-smoke — migration apply gate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Detect schema-relevant changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          # Migrations live at the top level of drizzle/ as NNNN_*.sql -- there is no nested
          # subdirectory for them. A defense-in-depth guard in the build-test job enforces
          # this filter stays accurate on every PR.
          filters: |
            schema:
              - 'drizzle/*.sql'
              - 'drizzle/meta/_journal.json'

      - name: Setup Node.js
        if: steps.filter.outputs.schema == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        if: steps.filter.outputs.schema == 'true'
        run: npm ci

      - name: Migration journal parity (INFRA-06 / Phase 12 regression)
        if: steps.filter.outputs.schema == 'true'
        run: npm run check:migration-journal-sync

      - name: Create ephemeral Neon branch
        if: steps.filter.outputs.schema == 'true'
        id: create-branch
        uses: neondatabase/create-branch-action@v5
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          parent: main
          branch_name: ci-${{ github.run_id }}
          api_key: ${{ secrets.NEON_API_KEY }}

      - name: Apply migrations against ephemeral branch
        if: steps.filter.outputs.schema == 'true'
        env:
          DATABASE_URL: ${{ steps.create-branch.outputs.db_url_with_pooler }}
        run: npm run db:migrate

      - name: Cleanup ephemeral Neon branch
        # always() ensures cleanup fires on success AND failure (D-06)
        if: always() && steps.filter.outputs.schema == 'true'
        uses: neondatabase/delete-branch-action@v3
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch: ci-${{ github.run_id }}
          api_key: ${{ secrets.NEON_API_KEY }}
